<html lang="gbk">
<head>
    <meta charset="UTF-8">
    <title>江东云</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body ontouchstart>

<div class="container">

    <div class="top">
        <button class="pure-button button-success" onclick="location.reload()">刷新</button>
        <button class="pure-button pure-button-primary" onclick="onStart()">云开始</button>
        <button class="pure-button pure-button-primary" onclick="onState()">云状态</button>
        <button class="pure-button button-warning" onclick="onUploadSetting()">上传</button>
        <button class="pure-button button-warning" onclick="onDownloadSetting()">下载</button>
        <button class="pure-button pure-button-primary" onclick="onFuncEnable()">功能</button>
        <div class="vip">
            <div class="vip-button" onclick="">设置...</div>
            <div class="vip-menu">
                <div class="menu-item" id="chest-config">采矿设置</div>
                <div class="menu-item" id="jiaofei">剿匪设置</div>
                <div class="menu-item" id="boss">BOSS</div>
                <div class="menu-item" id="legion-boss">军团远征</div>
                <div class="menu-item" id="shop">珍宝阁</div>
                <div class="menu-item" id="sweep">试炼扫荡</div>
                <div class="menu-item" id="on-sweep">名将扫荡</div>
                <div class="menu-item" id="tower-reward">试炼奖励</div>
                <div class="menu-item" id="donate">军团祈愿</div>
                <div class="menu-item" id="enlist">招贤纳士</div>
                <div class="menu-item" id="shopEx">武将结晶</div>
                <div class="menu-item" id="adventure">南征北战</div>
                <div class="menu-item" id="melee">军团乱斗</div>
                <div class="menu-item" id="slg">中军帐</div>
            </div>
        </div>
        <button class="pure-button button-success" onclick="onBuyCloud()">江东云</button>
        <div class="vip" style="display: block">
            <div class="vip-button" onclick="">一次性任务</div>
            <div class="vip-menu">
                <div class="menu-item" id="auto-tower">自动爬塔</div>
                <div class="menu-item" id="auto-arena">自动比武</div>
                <div class="menu-item" id="auto-practice">自动武神</div>
                <div class="menu-item" id="subs">更新矿号</div>
                <div class="menu-item" id="tidy-hero">英雄升星</div>
                <div class="menu-item" id="exchange">武将置换</div>
            </div>
        </div>
    </div>
    <div id="prog" style="display: none">
        <div>侦测进度</div>
        <progress id="progress" value="0" max="1000"></progress>
    </div>
    <div>
        <label>
            <input type="checkbox" checked onclick="onLogScroll(this)">日志自动滚动
        </label>
        <a href="javascript:void(0);" onclick="onClearLog()">清空所有日志</a>
    </div>
    <div class="bottom">
        <div id="log"></div>
        <div id="bottom"></div>
    </div>

</div>

</body>
</html>
